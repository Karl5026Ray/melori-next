name: Android Build & Upload (Play)

# Builds the native Android app (Capacitor wrapper in mobile/) on an Ubuntu
# runner, signs it with the upload keystore, and produces a Google Play–ready
# .aab. Optionally publishes to the Play internal testing track.
#
# TRIGGER: manual only (workflow_dispatch). Version name and version code are
# inputs rather than repo constants, mirroring the iOS workflow's
# marketing_version/build_number approach — nothing about a release should be
# hardcoded in the tree.
#
# PREREQUISITES — set these repository secrets (Settings → Secrets and
# variables → Actions → New repository secret). See mobile/BUILD_ANDROID.md
# for how to generate each value.
#
#   MELORI_KEYSTORE_BASE64      base64 of the upload keystore (.jks)
#   MELORI_KEYSTORE_PASSWORD    keystore password
#   MELORI_KEY_ALIAS            key alias inside the keystore
#   MELORI_KEY_PASSWORD         key password
#
# OPTIONAL — only needed once the Play account is verified and an app record
# for org.melorimusic.app exists:
#
#   PLAY_SERVICE_ACCOUNT_JSON   Google Play service account JSON
#
# The publish step is skipped automatically when that secret is absent, so the
# workflow is useful for producing artifacts long before Play is set up.
#
# APPLICATION ID: org.melorimusic.app

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name / versionName shown in Play (e.g. 1.0.1)"
        required: true
        default: "1.0.1"
      version_code:
        description: "Version code — integer, must be higher than the last uploaded build"
        required: true
        default: "1"
      publish_to_play:
        description: "Also upload to the Play internal testing track (requires PLAY_SERVICE_ACCOUNT_JSON). Type 'yes' to enable."
        required: false
        default: "no"

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & sign AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 8's Android library compiles against Java 21
          # (sourceCompatibility/targetCompatibility VERSION_21).
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Capacitor 8's CLI requires Node >=22 and refuses to run on 20.
          node-version: "22"

      - name: Install JS deps (Capacitor)
        run: npm install

      - name: Add & sync Android project
        run: |
          # android/ is git-ignored and regenerated, so it is created fresh here.
          npx cap add android || echo "android project already present"
          npx cap sync android

      - name: Configure Android project
        run: |
          # Re-applies everything `cap add/sync` overwrites: SDK 36 levels, the
          # real launcher icons, LiveKit/media permissions, App Links, and the
          # release signing config. Fails loudly if any of it doesn't stick.
          chmod +x scripts/configure-android.sh
          ./scripts/configure-android.sh
          echo "--- variables.gradle ---"
          cat android/variables.gradle

      - name: Decode upload keystore
        env:
          MELORI_KEYSTORE_BASE64: ${{ secrets.MELORI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MELORI_KEYSTORE_BASE64" ]; then
            echo "::error::MELORI_KEYSTORE_BASE64 is not set. A Play release must be signed." \
                 "Generate an upload keystore (see mobile/BUILD_ANDROID.md) and add the secret."
            exit 1
          fi
          printf '%s' "$MELORI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/melori-upload.jks"
          # Sanity check that we decoded a real keystore, not truncated base64.
          keytool -list -keystore "$RUNNER_TEMP/melori-upload.jks" \
            -storepass "${{ secrets.MELORI_KEYSTORE_PASSWORD }}" >/dev/null
          echo "Keystore decoded OK"

      - name: Build signed AAB
        env:
          MELORI_KEYSTORE_PATH: ${{ runner.temp }}/melori-upload.jks
          MELORI_KEYSTORE_PASSWORD: ${{ secrets.MELORI_KEYSTORE_PASSWORD }}
          MELORI_KEY_ALIAS: ${{ secrets.MELORI_KEY_ALIAS }}
          MELORI_KEY_PASSWORD: ${{ secrets.MELORI_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -PmeloriVersionName="${{ github.event.inputs.version_name }}" \
            -PmeloriVersionCode="${{ github.event.inputs.version_code }}"

      - name: Verify the bundle is signed
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "::error::no .aab produced at $AAB"; exit 1; }
          if ! unzip -l "$AAB" | grep -qE 'META-INF/.*\.(RSA|EC|DSA)'; then
            echo "::error::$AAB is not signed — check the MELORI_* signing secrets."
            exit 1
          fi
          echo "Signed bundle: $AAB"

      - name: Upload AAB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melori-android-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 14

      # --- Optional Play publish -------------------------------------------
      # Skipped unless explicitly requested AND the service account secret
      # exists. The Play developer account is not yet verified and there is no
      # app record for org.melorimusic.app, so this is a no-op today.
      - name: Check Play credentials
        id: play
        if: ${{ github.event.inputs.publish_to_play == 'yes' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::publish_to_play was requested but PLAY_SERVICE_ACCOUNT_JSON is not set — skipping upload."
          fi

      - name: Publish to Play internal testing
        if: ${{ steps.play.outputs.enabled == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.melorimusic.app
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
