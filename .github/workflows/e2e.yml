name: E2E (Playwright)

# Runs the mobile FloatingPlayer regression suite (e2e/floating-player.spec.ts)
# on every PR and on pushes to main. This is the safety net for PR #103 —
# any revert of the AudioPlayer.tsx fixes will fail these tests before merge.
#
# The suite builds and serves the CHECKED-OUT COMMIT inside the runner.
#
# It used to resolve the PR's Vercel preview URL instead, falling back to
# https://melorimusic.org when the preview was unreachable. Vercel Deployment
# Protection 302s every unauthenticated preview request, so that fallback fired
# on every run and the "required" check silently tested production — i.e. main,
# never the PR. A player change would fail against old code and a player
# regression would pass against good code. Testing the commit under test is the
# only thing that makes this check mean anything.
#
# The build runs against placeholder Supabase credentials: the suite seeds its
# own track into localStorage and never reads the catalog, and the client
# bundle only needs the NEXT_PUBLIC_* pair to be present and well-formed in
# order to hydrate. Repo secrets override them when configured.

on:
  pull_request:
    branches: [main]
    # Skip runs when only docs / markdown / images change — the suite exercises
    # runtime UI, so those never affect it.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "public/**"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "public/**"
  # Manual trigger — handy for pointing the suite at a deployed URL ad hoc
  # (e.g. verifying production after a Vercel domain change). Leave blank to
  # test the checked-out commit, same as a PR run.
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed URL to test instead of the checked-out commit"
        required: false
        default: ""

# Cancel in-progress runs on the same ref when a new commit lands — no point
# testing an older SHA when we already know a newer one is queued.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Mobile FloatingPlayer @ 390x844
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # GHA is deprecating Node 20 on its runners; 22 is the current LTS.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Chromium only — the mobile-chromium project pins browserName=chromium,
      # so we skip the ~1GB WebKit / Firefox downloads.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Skipped when a deployed URL was supplied via workflow_dispatch.
      - name: Build the app under test
        if: github.event.inputs.base_url == ''
        env:
          # Placeholders keep the client bundle constructible; see the header
          # note. Real repo secrets take precedence wherever they are set.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://e2e-placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'e2e-placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'e2e-placeholder-service-key' }}
          NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"
          # The type-check phase OOMs at the runner's default heap.
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npm run build

      # Playwright boots `npm run start` against the build above and tears it
      # down afterwards (see the webServer block in playwright.config.ts).
      - name: Run Playwright tests
        env:
          BASE_URL: ${{ github.event.inputs.base_url }}
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://e2e-placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'e2e-placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'e2e-placeholder-service-key' }}
          NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"
          # Only used when base_url points at an SSO-protected Vercel preview.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          echo "Testing: ${BASE_URL:-the checked-out commit at http://127.0.0.1:3000}"
          npm run test:e2e

      # Uploads screenshots, videos, and traces on failure so we can diagnose
      # regressions without re-running locally.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
